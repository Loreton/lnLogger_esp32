; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

#CLI:
#    pio run  Process (build) all environments specified in “platformio.ini” (Project Configuration File)
#    pio run --target upload. Build project and upload firmware to the all devices specified in “platformio.ini” (Project Configuration File)
#    pio run --target clean. Clean project (delete compiled objects)
#    pio run -e uno. Process only uno environment
#    pio run -e uno -t upload. Build project only for uno and upload firmware.
#    pio device monitor



[env:esp32]
    # sembra funzionare con AzDelivery ESP32-WROOM 32
    platform = espressif32 @ ^6.8.0   # È buona pratica bloccare la versione della piattaforma per evitare che aggiornamenti futuri rompano il codice (specialmente con le API di `ledc` o simili).
    ; platform = espressif32
    framework = arduino
    board = esp32dev
    upload_speed = 460800
    monitor_speed = 115200
    monitor_filters = colorize
    upload_port = /dev/ttyUSB0
    # board_build.filesystem = littlefs
    # extra_scripts = presscontrol_extra_flags.py



    # -------------------------------------
    # ref: https://docs.platformio.org/en/stable/search.html?q=lib_deps&check_keywords=yes&area=default
    #   per le mie librerie posso ettere il path di github:
    #       https://github.com/Loreton/wifiManager          (abbreviata)
    #       https://github.com/Loreton/wifiManager.git
    #       https://github.com/Loreton/wifiManager.git#1.0.2 (TAG)
    # -------------------------------------
    lib_deps =
        fbiego/ESP32Time            ####.  @ ^2.0.6
        ; paulstoffregen/OneWire @ ^2.3.8
        ; milesburton/DallasTemperature @ ^4.0.6
        ; Aircoookie/Espalexa @ ^2.7.0
        ; witnessmenow/UniversalTelegramBot @ ^1.3.0
        ; https://github.com/Loreton/wifiManager.git
        ; cotestatnt/AsyncTelegram2 @ ^2.1.8


    # -------------------------------------
    # ref: https://docs.platformio.org/en/stable/projectconf/sections/env/options/build/build_flags.html
    # inserire gli include file, opzioni per il compilatore
    # considerare che pr i relative path, la base_dir --> same level of src
    # -------------------------------------
    build_flags=
        ${sysenv.ln_PIORUN_BUILD_FLAGS}
        -D __ln_MODULE_DEBUG_TEST__   ### se definito include tutti i moduli utilizzati per i test della libreria
        ; -I Source/include





    # ref: https://docs.platformio.org/en/stable/projectconf/sections/env/options/library/lib_ignore.html
    lib_ignore =
        ; telegram_sample # solo nome del folder sena il path
        ; @testArea # solo nome del folder senza il path
        ; examples # solo nome del folder senza il path
        ; samples # solo nome del folder senza il path


    # -------------------------------------
    # inserire le librerie esterne o personali da includere nella compilazione
    # considerare che pr i relative path, la base_dir --> same level of src
    # -------------------------------------
    lib_extra_dirs =
        ; ../../a_pressControlLib
        # ../../../esp32LnLibrary/externalLibraries


    # -------------------------------------
    # ref: https://docs.platformio.org/en/stable/projectconf/sections/env/options/build/build_src_filter.html
    # inserire tutti i percorsi che si desidera inserire nel codice
    # considerare che per i relative path, la base_dir --> src
    # -------------------------------------
    build_src_filter =
        +<*>                            ; IMPORTANTE se si usano questi filtri
        +<../test/lnLogger_test.cpp>
        -<../test/test_getTimeStamp.cpp> ; Escludiamo l'altro test per evitare conflitti di main



[platformio]
    ; src_dir = .
    default_envs = esp32


